# Alternative to running the API on the host: run the entire HeadsUp stack.
name: headsup-api-local

services:
  api:
    container_name: headsup-api
    image: headsup-api:dev
    build:
      context: .
      target: dev
    command: bash -c "uv run --locked alembic upgrade head && uv run --locked
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    volumes:
      - .:/app/
      - /app/.venv
    env_file:
      - .env
    environment:
      DB_ADDRESS: db
      DB_PORT: "5432"
      REDIS_HOST: cache
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    extends:
      file: compose.local.yml
      service: db

  mailpit:
    extends:
      file: compose.local.yml
      service: mailpit

  cache:
    container_name: headsup-cache
    image: redis:8
    profiles: [cache]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cache:/data

volumes:
  postgres-data:
  cache:
