worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Token-bearing query strings are deliberately excluded from access logs.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # This gateway is private and reached through the existing trusted tunnel.
    # Replace any client-supplied forwarded chain with the edge's client address.
    map $http_cf_connecting_ip $client_address {
        default $remote_addr;
        ~^[0-9a-fA-F:.]+$ $http_cf_connecting_ip;
    }
    server {
        listen 8080;
        client_max_body_size 2m;
        location / {
            set $backend http://api:8000;
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $client_address;
            proxy_set_header X-Real-IP $client_address;
            proxy_set_header Connection '';
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_cache off;
            add_header Cache-Control 'no-store' always;
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
