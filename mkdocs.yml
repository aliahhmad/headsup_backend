site_name: HeadsUp
site_description: Stay informed without having to keep checking.

theme:
  name: material
  palette:
    primary: light-blue
    accent: blue
  features:
    - navigation.footer
    - content.code.copy
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - toc.follow

plugins:
  - search

# The site builds without importing application settings or accessing a database.
dev_addr: '127.0.0.1:9000'

markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - md_in_html
  - attr_list
  - tables

validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - Introduction: index.md
  - Quick start: quick-start.md
  - Configuration: usage/configuration/environment.md
  - Accounts and access: accounts.md
  - Monitoring:
      - Monitors: monitors.md
      - Recurring scheduling: scheduling.md
      - Research worker: monitor-worker.md
      - Alerts and updates: alerts.md
      - In-app notifications: notifications.md
      - Alert emails: alert-emails.md
  - Administration:
      - Queue management: queue.md
      - Run dashboard: run-dashboard.md
  - Operations:
      - Database and services: operations.md
      - Server deployment: deployment/deployment.md
      - Troubleshooting: troubleshooting.md
  - Development:
      - Development and testing: development/local.md
      - Project structure: project-organization.md
      - Documentation: development/documentation.md
      - Deferred capabilities: future.md
      - Contributing: contributing.md
  - API:
      - Overview: reference/api.md
      - Interactive documentation: reference/swagger.md
  - License: license.md
